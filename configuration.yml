building_name: batiment_600m2

name: borehole
suffix: no_bypass_setpoint_55_35

os_ep_path: "C:/openstudioapplication-1.8.0/EnergyPlus"

zones:
  - "RDC"
  - "RPLUS1"

loops:
  - soil_loop
  - water_heating_loop

equipments:
  - borehole
  - soil_pump
  - hpwtw
  - inside_pump    

# below are setups
soil_loop:
  setpoint: constant_set_point
  operation: [borehole]
  branches:
    plant: [soil_pump, borehole]
    demand: [hpwtw]

water_heating_loop:
  setpoint: water_law_set_point
  operation: [hpwtw]
  branches:
    plant: [hpwtw, inside_pump]

constant_set_point:
  temp: 12

water_law_set_point:
  Setpoint_at_Outdoor_Low_Temperature: 55
  Outdoor_Low_Temperature: -5
  Setpoint_at_Outdoor_High_Temperature: 35
  Outdoor_High_Temperature: 15

borehole:
  Number_of_Boreholes_in_XDirection: 5
  Number_of_Boreholes_in_YDirection: 2

hpwtw:
  Reference_Coefficient_of_Performance: 2.5
  type: heatpump
