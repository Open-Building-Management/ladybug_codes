
name: Build the idfhub image

on:
  workflow_dispatch:
    inputs:
      energyplus_version:
        description: "energyplus version"
        required: true
        default: 24.1.0
        type: string
      energyplus_build:
        description: "energyplus build tag"
        required: true
        default: 9d7789a3ac
        type: string
      idfhub_ref:
        description: 'idfhub ref tag'
        required: true
        default: '0.0.4'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          build-args: |
            "ENERGYPLUS_VERSION=${{ inputs.energyplus_version }}"
            "ENERGYPLUS_BUILD=${{ inputs.energyplus_build }}"
            "IDFHUB_REF=${{ inputs.idfhub_ref }}"
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:ep${{ inputs.energyplus_version }}_idfhub${{ inputs.idfhub_ref}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
