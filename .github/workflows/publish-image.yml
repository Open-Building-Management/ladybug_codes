
name: Build the idfhub image

on:
  workflow_dispatch:
    inputs:
      energyplus_version:
        description: "energyplus version"
        required: true
        default: 24.1.0
        type: string
      energyplus_build:
        description: "energyplus build tag"
        required: true
        default: 9d7789a3ac
        type: string
      idfhub_ref:
        description: 'idfhub ref tag'
        required: true
        default: '0.0.4'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name and tag
        env:
          ENERGYPLUS_VERSION: ${{ inputs.energyplus_version }}
          ENERGYPLUS_BUILD: ${{ inputs.energyplus_build }}
          IDFHUB_REF: ${{ inputs.idfhub_ref }}
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          t0="ep${ENERGYPLUS_VERSION}-${ENERGYPLUS_BUILD}"
          t1="_idfhub${IDFHUB_REF}"
          echo "tag=$t0$t1" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          build-args: |
            ENERGYPLUS_VERSION=${{ inputs.energyplus_version }}
            ENERGYPLUS_BUILD=${{ inputs.energyplus_build }}
            IDFHUB_REF=${{ inputs.idfhub_ref }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
