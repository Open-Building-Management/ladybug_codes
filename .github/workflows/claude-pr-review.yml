name: Claude PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: string

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post acknowledgment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT_TOKEN }}
          script: |
            const prNumber = '${{ inputs.pr_number }}';

            const comment = `## 🤖 Claude Review Initiated

            Review requested manually for PR #${prNumber}

            **PR Link**: https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}

            Claude analysis will be provided separately.
            `;

            await github.rest.issues.createComment({
              issue_number: Number(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
