building_name: Agence_ACF
North_Axis: 122.4

name: borehole_500ml_reducedFlow30_80
suffix: SP5535

os_ep_path: "C:/openstudioapplication-1.8.0/EnergyPlus"

zones:
  - "RDC"
  - "RPLUS1"

loops:
  - soil_loop
  - water_heating_loop

equipments:
  - borehole
  - soil_pump
  - hpwtw
  - inside_variable_pump
  - baseboards_RDC
  - baseboards_RPLUS1

sensors:
  borehole_t:
    type: "System Node Temperature"
    loop: soil_loop
    side: plant
    port: inlet

controls:
  borehole_pump_control:
    sensor: borehole_t
    type: Pump_Flow_Rate_Schedule_Name
    pilot: [soil_pump, inside_variable_pump]
    stop_below: -5
    start_above: -2
    min: 0.3
    max: 0.8

soil_loop:
  setpoint: constant_set_point
  operation: [borehole]
  branches:
    plant: [soil_pump, borehole]
    demand: [hpwtw]
  Loop_Type: cooling
  Design_Loop_Exit_Temperature: 12
  Loop_Design_Temperature_Difference: 5
  Maximum_Loop_Temperature: 35
  Minimum_Loop_Temperature: -5

water_heating_loop:
  setpoint: water_law_set_point
  operation: [hpwtw]
  branches:
    plant: [inside_variable_pump, hpwtw]
    demand:
      - parallel:
        - [baseboards_RDC]
        - [baseboards_RPLUS1]

constant_set_point:
  temp: 12

water_law_set_point:
  Setpoint_at_Outdoor_Low_Temperature: 55
  Outdoor_Low_Temperature: -5
  Setpoint_at_Outdoor_High_Temperature: 35
  Outdoor_High_Temperature: 15

borehole:
  Number_of_Boreholes_in_XDirection: 5
  Number_of_Boreholes_in_YDirection: 1

hpwtw:
  Reference_Coefficient_of_Performance: 2.5
  type: heatpump
