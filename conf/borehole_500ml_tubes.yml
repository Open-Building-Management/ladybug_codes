building_name: batiment_600m2

name: borehole
suffix: SP_35_55_500ml_tubes

os_ep_path: "C:/openstudioapplication-1.8.0/EnergyPlus"

zones:
  - "RDC"
  - "RPLUS1"

loops:
  - soil_loop
  - water_heating_loop

equipments:
  - borehole
  - soil_pump
  - hpwtw
  - inside_variable_pump
  - baseboards_RDC
  - baseboards_RPLUS1

sensors:
  soil_sensor:
    active: 1
    loop: soil_loop
    side: plant
    port: inlet
    type: "System Node Temperature"
    controls: [soil_pump, inside_variable_pump]
    stop_below: -5
    start_above: -2
    min_flow: 0.1
    normal_flow: 1.0

soil_loop:
  setpoint: constant_set_point
  operation: [borehole]
  branches:
    plant: [soil_pump, borehole]
    demand: [hpwtw]
  Loop_Type: cooling
  Design_Loop_Exit_Temperature: 12
  Loop_Design_Temperature_Difference: 5

water_heating_loop:
  setpoint: water_law_set_point
  operation: [hpwtw]
  branches:
    plant: [hpwtw, inside_variable_pump]
    demand:
      - parallel:
        - [baseboards_RDC]
        - [baseboards_RPLUS1]

constant_set_point:
  temp: -10

water_law_set_point:
  Setpoint_at_Outdoor_Low_Temperature: 55
  Outdoor_Low_Temperature: -5
  Setpoint_at_Outdoor_High_Temperature: 35
  Outdoor_High_Temperature: 15

borehole:
  Number_of_Boreholes_in_XDirection: 5
  Number_of_Boreholes_in_YDirection: 1

hpwtw:
  Reference_Coefficient_of_Performance: 2.5
  type: heatpump
