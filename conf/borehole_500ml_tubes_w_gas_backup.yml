building_name: batiment_600m2

name: borehole_500ml_gaz_load_op_ctrl
suffix: SP7040

os_ep_path: "C:/openstudioapplication-1.8.0/EnergyPlus"

zones:
  - "RDC"
  - "RPLUS1"

loops:
  - soil_loop
  - water_heating_loop

equipments:
  - borehole
  - soil_pump
  - hpwtw
  - inside_variable_pump
  - gas_boiler
  - baseboards_RDC
  - baseboards_RPLUS1

sensors:
  soil_sensor:
    type: "System Node Temperature"
    loop: soil_loop
    side: plant
    port: inlet

controls:
  pump_control:
    pilot: [soil_pump, inside_variable_pump]
    type: Pump_Flow_Rate_Schedule_Name
    sensor: soil_sensor
    stop_below: -5
    start_above: -2
    min: 0.1
    max: 1.0

soil_loop:
  setpoint: constant_set_point
  operation: [borehole]
  branches:
    plant: [soil_pump, borehole]
    demand: [hpwtw]
  Loop_Type: cooling
  Design_Loop_Exit_Temperature: 12
  Loop_Design_Temperature_Difference: 5
  Maximum_Loop_Temperature: 35
  Minimum_Loop_Temperature: -5

water_heating_loop:
  setpoint: water_law_set_point
  operation: [hpwtw, gas_boiler]
  Loop_Type: heating_mix_load
  branches:
    plant: [inside_variable_pump, hpwtw, gas_boiler]
    demand:
      - parallel:
        - [baseboards_RDC]
        - [baseboards_RPLUS1]

constant_set_point:
  temp: -10

water_law_set_point:
  Setpoint_at_Outdoor_Low_Temperature: 70
  Outdoor_Low_Temperature: -5
  Setpoint_at_Outdoor_High_Temperature: 40
  Outdoor_High_Temperature: 15

borehole:
  Number_of_Boreholes_in_XDirection: 5
  Number_of_Boreholes_in_YDirection: 1

hpwtw:
  Reference_Coefficient_of_Performance: 2.5
  operation_range: [0, 25000]
  type: heatpump

gas_boiler:
  force_side: Boiler_Water
  operation_range: [25000, 100000]
  efficiency_c: 0.96
  efficiency_x: 0.04 # x=PLR
  efficiency_x2: -0.03
  efficiency_y: -0.004 # y=Twater
  efficiency_y2: -0.00004
  efficiency_xy: 0
