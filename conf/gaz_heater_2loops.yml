building_name: batiment_600m2

name: gaz_boiler
suffix: dual_loop_2

os_ep_path: "C:/openstudioapplication-1.8.0/EnergyPlus"

zones:
  - "RDC"
  - "RPLUS1"

loops:
  - boiler_water_heating_loop
  - baseboards_water_heating_loop

equipments:
  - gas_boiler
  - boiler_variable_pump
  - baseboards_variable_pump
  - HX
  - baseboards_RDC
  - baseboards_RPLUS1

boiler_water_heating_loop:
  setpoint: water_law_set_point
  operation: [gas_boiler]
  branches:
    plant: [boiler_variable_pump, gas_boiler]
    demand: [HX]

baseboards_water_heating_loop:
  setpoint: water_law_set_point
  operation: [HX]
  branches:
    plant: [HX]
    demand:
      - [baseboards_variable_pump]
      - parallel:
        - [baseboards_RDC]
        - [baseboards_RPLUS1]

water_law_set_point:
  Setpoint_at_Outdoor_Low_Temperature: 70
  Outdoor_Low_Temperature: -5
  Setpoint_at_Outdoor_High_Temperature: 40
  Outdoor_High_Temperature: 15

gas_boiler:
  force_side: Boiler_Water
  efficiency_c: 0.96
  efficiency_x: 0.04 # x=PLR
  efficiency_x2: -0.03
  efficiency_y: -0.004 # y=Twater
  efficiency_y2: -0.00004
  efficiency_xy: 0

HX:
  type: exchanger
