building_name: 8_bardoux

name: airloop
suffix: test

Terrain: City

os_ep_path: "C:/openstudioapplication-1.8.0/EnergyPlus"

zones:
  - r4

loops: []

airloops:
  - airloop

equipments:
  - constant_fan
  - cv_no_reheat_r4
  - oa_mixer_airloop
  - coil_system_cooling_dx

airloop:
  setpoints: [multi_zone_cooling]
  operation: [coil_system_cooling_dx] 
  branches:
    air_supply:
      - oa_system_airloop
      - coil_system_cooling_dx
      - constant_fan
  terminals:
    - cv_no_reheat_r4

oa_system_airloop:
  mixer: oa_mixer_airloop

oa_mixer_airloop:
  controller: oa_controller_airloop

coil_system_cooling_dx:
  force_side: DX_Cooling_Coil_System
  coil: coil_cooling_dx_single_speed

coil_cooling_dx_single_speed:
  Gross_Rated_Total_Cooling_Capacity: 5000
  force_side: Air
  cop: 3

constant_fan:
  force_side: Air

cv_no_reheat_r4:
  force_side: Air
  process: cooling
