soil_pump_elec:
  name: "Pump Electricity Rate"
  key: "SOIL_PUMP"
  label: "soil pump W"

pac_pump_elec:
  name: "Pump Electricity Rate"
  key: PAC_VARIABLE_PUMP
  label: "pac pump W"

zone_pump_elec:
  name: "Pump Electricity Rate"
  key: ZONE_VARIABLE_PUMP
  label: "zone pump W"

fan_rdc_elec:
  name: "Fan Coil Fan Electricity Rate"
  key: FCU_RDC
  label: "fan RDC W"

fan_rplus1_elec:
  name: "Fan Coil Fan Electricity Rate"
  key: FCU_RPLUS1
  label: "fan RPLUS1 W"

borehole_delta_t:
  label: "borehole deltaT °C"

pac_load_delta_t:
  label: "pac deltaT °C"

outdoor_t:
  name: "Site Outdoor Air Drybulb Temperature"
  key: Environment
  label: "Outdoor Temp °C"
  
indoor_t_r1:
  name: "Zone Air Temperature"
  key: RPLUS1
  label: "RPLUS1 temp °C"

indoor_hr_r1:
  name: "Zone Air Relative Humidity"
  key: RPLUS1

glhe_inlet_t:
  name: "Ground Heat Exchanger Inlet Temperature"
  key: "BOREHOLE"
  label: "Soil inlet °C"

glhe_outlet_t:
  name: "Ground Heat Exchanger Outlet Temperature"
  key: "BOREHOLE"
  label: "Soil outlet °C"

glhe_average_t:
  name: "Ground Heat Exchanger Average Borehole Temperature"
  key: "BOREHOLE"
  label: "Average Borehole °C"

glhe_heat_rate:
  name: "Ground Heat Exchanger Heat Transfer Rate"
  key: "BOREHOLE"
  label: "Borehole Heat Transfer W"

pac_source_heat_transfer:
  name: "Heat Pump Source Side Heat Transfer Rate"
  key: HPWTW
  label: "HP source heat W"

pac_elec:
  name: "Heat Pump Electricity Rate"
  key: HPWTW
  label: "HeatPump W"

pac_load_heat_transfer:
  name: "Heat Pump Load Side Heat Transfer Rate"
  key: HPWTW
  label: "HP Load heat W"

pac_load_inlet_t:
  name: "Heat Pump Load Side Inlet Temperature"
  key: "HPWTW"

pac_load_outlet_t:
  name: "Heat Pump Load Side Outlet Temperature"
